services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: hazchem-store-api:latest
    container_name: hazchem-store-api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
